---
- name: Enable bgpd daemon in /etc/frr/daemons
  lineinfile:
    path: /etc/frr/daemons
    regexp: "^bgpd="
    line: "bgpd=yes"
  notify: restart frr

- name: Deploy BGP FRR configuration
  template:
    src: "frr_bgp_{{ inventory_hostname | lower }}.conf.j2"
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: restart frr
